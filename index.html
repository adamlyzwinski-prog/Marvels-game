<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Marvel Card Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1, h2, h3 {
            color: #ffffff;
        }
        .section {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #b20710;
        }
        .btn-sell {
            background-color: #333;
            font-size: 11px;
            padding: 4px 8px;
            margin-top: 5px;
        }
        .btn-sell:hover {
            background-color: #555;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            border: 2px solid #444;
            position: relative;
        }
        .card.rare { border-color: #3b82f6; }
        .card.epic { border-color: #a855f7; }
        .card.mythic { border-color: #eab308; }
        .card.legendary { border-color: #ef4444; }
        .card.locked { opacity: 0.5; filter: grayscale(100%); }
        
        .card-inner-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card-top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .card-avatar {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            overflow: hidden;
            background: #111;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-name-banner {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .card-stats-box {
            font-size: 11px;
            margin-bottom: 5px;
            display: flex;
            gap: 5px;
            justify-content: center;
        }
        .card-footer-box {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 10px;
            color: #ccc;
        }

        /* Pasek HP bossa w stylu Minecrafta */
        .minecraft-hp-bar {
            width: 100%;
            background: #555;
            height: 8px;
            border-radius: 2px;
            overflow: hidden;
            margin: 4px 0;
            border: 1px solid #222;
        }
        .minecraft-hp-fill {
            height: 100%;
            background: #22c55e;
            width: 100%;
            transition: width 0.3s ease;
        }
        .minecraft-hp-text {
            font-size: 10px;
            color: #ccc;
            margin-bottom: 4px;
        }

        /* Deck */
        .deck-slots {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .deck-slot {
            width: 130px;
            height: 180px;
            background: #222;
            border: 2px dashed #444;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            box-sizing: border-box;
        }
        .deck-slot.filled {
            border-style: solid;
            background: #2a2a2a;
        }

        /* Koło fortuny */
        .roulettes-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .roulette-wrapper {
            position: relative;
            width: 400px;
            height: 90px;
            background: #111;
            border: 2px solid #444;
            border-radius: 6px;
            overflow: hidden;
        }
        .roulette-pointer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #e50914;
            transform: translateX(-50%);
            z-index: 10;
        }
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
        }
        .wheel-card {
            width: 74px;
            height: 82px;
            background: #2a2a2a;
            margin: 2px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 2px solid #555;
            font-size: 10px;
        }
        .wheel-card .card-avatar {
            width: 40px;
            height: 40px;
        }
        .spin-options {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .spin-btn-option {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .spin-btn-option.selected {
            background: #e50914;
            border-color: #ff4d4f;
        }

        /* Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center;" class="section">
        <h1>Marvel Card Game</h1>
        <div>
            <span>Zalogowany: <strong id="current-user-display">-</strong></span> | 
            <span>Pieniądze: <strong id="money">0</strong> $</span>
            <button class="btn" onclick="claimDaily()">Odbierz Daily</button>
        </div>
    </div>

    <!-- 1. SKLEP -->
    <div class="section">
        <h2>1. Sklep (Paczki)</h2>
        <div id="shop-packs" class="grid"></div>
    </div>

    <!-- 2. KOŁO FORTUNY -->
    <div class="section">
        <h2>2. Koło Fortuny</h2>
        <div class="spin-options">
            <button class="spin-btn-option selected" id="spin-count-1" onclick="setSpinCount(1)">1 Los (35 $)</button>
            <button class="spin-btn-option" id="spin-count-3" onclick="setSpinCount(3)">3 Losy (105 $)</button>
            <button class="spin-btn-option" id="spin-count-5" onclick="setSpinCount(5)">5 Losów (175 $)</button>
        </div>
        <div id="roulettes-box" class="roulettes-box"></div>
        <button class="btn" id="spin-btn" onclick="spinWheel()">Zakręć!</button>
    </div>

    <!-- 3. INDEKS -->
    <div class="section">
        <h2>3. Indeks / Kolekcja Kart</h2>
        <div id="collection-grid" class="grid"></div>
    </div>

    <!-- 4. DECK -->
    <div class="section">
        <h2>4. Twój Aktywny Deck</h2>
        <div id="deck-slots-container" class="deck-slots"></div>
    </div>

    <!-- 5. WALKA -->
    <div class="section">
        <h2>5. Arena Walki z Bossami</h2>
        <div id="boss-selection">
            <p>Wybierz przeciwnika:</p>
            <button class="btn" onclick="startBattle('weak')">Słaby Goblin Boss</button>
            <button class="btn" onclick="startBattle('good')">Opancerzony Najemnik</button>
            <button class="btn" onclick="startBattle('mythic')">Wielki Lord Ciemności</button>
            <button class="btn" onclick="startBattle('legendary')">Kosmiczny Tytan</button>
        </div>
        <div id="battle-arena" style="display: none;">
            <h3 id="boss-name-display"></h3>
            <div class="minecraft-hp-text" id="boss-hp-text">HP: 0/0</div>
            <div class="minecraft-hp-bar"><div class="minecraft-hp-fill" id="boss-hp-fill"></div></div>
            
            <div id="battle-log" style="background:#111; padding:10px; height:120px; overflow-y:scroll; font-size:12px; border:1px solid #333; margin: 10px 0;"></div>
            
            <h4>Twoje karty do walki:</h4>
            <div id="battle-deck-container" class="deck-slots"></div>
            <button class="btn" style="margin-top: 10px;" onclick="endBattle()">Uciekaj z walki</button>
        </div>
    </div>

    <!-- 6. SZPITAL -->
    <div class="section">
        <h2>6. Szpital (Leczenie Kart)</h2>
        <div id="hospital-grid" class="grid"></div>
    </div>

    <!-- 7. KODY -->
    <div class="section">
        <h2>7. Kody Promocyjne</h2>
        <input type="text" id="promo-code-input" placeholder="Wpisz kod..." style="padding: 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff;">
        <button class="btn" onclick="redeemCode()">Użyj kodu</button>
    </div>

    <!-- Modal nagród -->
    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Nagroda</h2>
            <div id="pulled-cards-container" class="grid" style="margin: 15px 0;"></div>
            <button class="btn" onclick="closeModal()">Zamknij</button>
        </div>
    </div>

    <script>
        let currentUser = "Gracz1";
        let money = 1000;
        let lastDailyClaim = 0;
        let usedCodes = [];
        let selectedSpinCount = 1;
        let currentBoss = null;

        const allCards = [
            { id: "iron_man", name: "Iron Man", rarity: "legendary", maxHp: 120, attack: 45, value: 500, icon: "" },
            { id: "spider_man", name: "Spider-Man", rarity: "epic", maxHp: 90, attack: 30, value: 250, icon: "" },
            { id: "captain_america", name: "Captain America", rarity: "epic", maxHp: 100, attack: 28, value: 250, icon: "" },
            { id: "thor", name: "Thor", rarity: "legendary", maxHp: 140, attack: 50, value: 600, icon: "" },
            { id: "hulk", name: "Hulk", rarity: "mythic", maxHp: 180, attack: 55, value: 400, icon: "" },
            { id: "hawkeye", name: "Hawkeye", rarity: "rare", maxHp: 70, attack: 20, value: 100, icon: "" }
        ];

        const packs = [
            { id: 'rare', name: 'Zwykła Paczka', price: 50, cardsCount: 3 },
            { id: 'epic', name: 'Epicka Paczka', price: 150, cardsCount: 3 },
            { id: 'mythic', name: 'Mityczna Paczka', price: 400, cardsCount: 3 },
            { id: 'legendary', name: 'Legendarna Paczka', price: 1000, cardsCount: 3 }
        ];

        let inventory = { iron_man: 1, spider_man: 2, captain_america: 1, thor: 0, hulk: 1, hawkeye: 3 };
        let cardHp = { iron_man: 120, spider_man: 90, captain_america: 100, hulk: 180, hawkeye: 70 };
        let activeDeck = ["iron_man", "spider_man", null, null];

        document.getElementById('current-user-display').innerText = currentUser;
        initRoulettes(1);
        updateUI();

        function saveUserData() {
            if (!currentUser) return;
            const usersDb = JSON.parse(localStorage.getItem('marvel_users_db')) || {};
            usersDb[currentUser] = {
                password: usersDb[currentUser] ? usersDb[currentUser].password : "",
                money: money,
                inventory: inventory,
                cardHp: cardHp,
                activeDeck: activeDeck,
                lastDailyClaim: lastDailyClaim,
                usedCodes: usedCodes
            };
            localStorage.setItem('marvel_users_db', JSON.stringify(usersDb));
        }

        function updateUI() {
            document.getElementById('money').innerText = money;
            renderShop();
            renderCollection();
            renderDeck();
            renderHospital();
            saveUserData();
        }

        function claimDaily() {
            const now = Date.now();
            if (now - lastDailyClaim < 86400000) {
                alert("Codzienną nagrodę można odbierać raz na 24 godziny!");
                return;
            }
            lastDailyClaim = now;
            money += 150;
            alert("Odebrano codzienną nagrodę: +150 $!");
            updateUI();
        }

        function redeemCode() {
            const codeInput = document.getElementById('promo-code-input');
            const code = codeInput.value.trim();

            if (!code) { alert("Wpisz kod!"); return; }
            if (usedCodes.includes(code)) { alert("Ten kod został już wykorzystany!"); return; }

            if (code === "2026") {
                money += 25; usedCodes.push(code); alert("Otrzymałeś 25 $!");
            } else if (code === "-+=") {
                money += 10000; usedCodes.push(code); alert("Otrzymałeś 10 000 $!");
            } else if (code === "TWÓRCAXYZ") {
                money += 1000; usedCodes.push(code); alert("Otrzymałeś 1000 $!");
            } else {
                alert("Nieprawidłowy kod!"); return;
            }
            codeInput.value = "";
            updateUI();
        }

        function getRandomCardByRarityWeights(packType) {
            let weights = { rare: 85, epic: 12, mythic: 2.5, legendary: 0.5 };
            if (packType === 'epic') {
                weights = { rare: 70, epic: 22, mythic: 6.5, legendary: 1.5 };
            } else if (packType === 'mythic') {
                weights = { rare: 55, epic: 30, mythic: 11, legendary: 4 };
            } else if (packType === 'legendary') {
                weights = { rare: 40, epic: 38, mythic: 17, legendary: 5 };
            }

            const totalWeight = weights.rare + weights.epic + weights.mythic + weights.legendary;
            let randomNum = Math.random() * totalWeight;

            let chosenRarity = 'rare';
            if (randomNum < weights.rare) {
                chosenRarity = 'rare';
            } else if (randomNum < weights.rare + weights.epic) {
                chosenRarity = 'epic';
            } else if (randomNum < weights.rare + weights.epic + weights.mythic) {
                chosenRarity = 'mythic';
            } else {
                chosenRarity = 'legendary';
            }

            const pool = allCards.filter(card => card.rarity === chosenRarity);
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function openPack(packId) {
            const pack = packs.find(p => p.id === packId);
            if (!pack || money < pack.price) {
                alert("Nie masz wystarczająco dużo pieniędzy!");
                return;
            }

            money -= pack.price;
            let pulled = [];
            for (let i = 0; i < pack.cardsCount; i++) {
                let card = getRandomCardByRarityWeights(packId);
                inventory[card.id]++;
                if (cardHp[card.id] === undefined || cardHp[card.id] <= 0) {
                    cardHp[card.id] = card.maxHp;
                }
                pulled.push(card);
            }

            updateUI();
            showModal(`Otwarto paczkę: ${pack.name}`, pulled);
        }

        function renderShop() {
            const shopContainer = document.getElementById('shop-packs');
            shopContainer.innerHTML = '';
            packs.forEach(pack => {
                const cardEl = document.createElement('div');
                cardEl.className = 'pack-card card';
                cardEl.innerHTML = `
                    <h3>${pack.name}</h3>
                    <p>Zawiera ${pack.cardsCount} karty</p>
                    <p class="card-value">${pack.price} $</p>
                    <button class="btn" onclick="openPack('${pack.id}')">Kup paczkę</button>
                `;
                shopContainer.appendChild(cardEl);
            });
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            allCards.forEach(card => {
                const count = inventory[card.id] || 0;
                const hp = cardHp[card.id] !== undefined ? cardHp[card.id] : card.maxHp;
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.rarity} ${count === 0 ? 'locked' : ''}`;
                
                cardDiv.innerHTML = `
                    <div class="card-inner-frame" onclick="handleCardClick('${card.id}')">
                        <div class="card-top-bar">
                            <span>ID: ${card.id}</span>
                            <span class="card-chrome-logo">MARVEL</span>
                        </div>
                        <div class="card-avatar">
                            ${count > 0 ? `<img src="${card.icon}" alt="${card.name}">` : '❓'}
                        </div>
                        <div class="card-name-banner">${card.name}</div>
                        <div class="card-stats-box">
                            <span>❤️ ${hp}/${card.maxHp}</span>
                            <span>⚔️ ${card.attack}</span>
                        </div>
                        <div class="card-footer-box">
                            <span class="card-value">${card.value} $</span>
                            <span class="card-count">x${count}</span>
                        </div>
                    </div>
                    ${count > 0 ? `<button class="btn btn-sell" onclick="event.stopPropagation(); sellCard('${card.id}')">Sprzedaj (${card.value / 2}$)</button>` : ''}
                `;
                grid.appendChild(cardDiv);
            });
        }

        function sellCard(cardId) {
            if (inventory[cardId] > 0) {
                inventory[cardId]--;
                const card = allCards.find(c => c.id === cardId);
                money += card.value / 2;
                if (inventory[cardId] === 0) {
                    activeDeck = activeDeck.map(id => id === cardId ? null : id);
                }
                updateUI();
            }
        }

        function handleCardClick(cardId) {
            const count = inventory[cardId] || 0;
            if (count === 0) return;

            if (activeDeck.includes(cardId)) {
                alert("Ta karta jest już w decku!");
                return;
            }

            for (let i = 0; i < activeDeck.length; i++) {
                if (activeDeck[i] === null) {
                    activeDeck[i] = cardId;
                    updateUI();
                    return;
                }
            }
            alert("Twój deck jest pełny!");
        }

        function renderDeck() {
            const container = document.getElementById('deck-slots-container');
            container.innerHTML = '';
            activeDeck.forEach((cardId, index) => {
                const slot = document.createElement('div');
                slot.className = `deck-slot ${cardId ? 'filled' : ''}`;
                if (cardId) {
                    const card = allCards.find(c => c.id === cardId);
                    const hp = cardHp[card.id];
                    slot.className += ` ${card.rarity}`;
                    slot.innerHTML = `
                        <div class="card-inner-frame" style="width:100%; height:100%;">
                            <div class="card-top-bar"><span>Slot ${index+1}</span></div>
                            <div class="card-avatar" style="width:45px; height:45px;"><img src="${card.icon}" alt="${card.name}"></div>
                            <div class="card-name-banner">${card.name}</div>
                            <div class="card-stats-box"><span>❤️ ${hp}</span><span>⚔️ ${card.attack}</span></div>
                            <button class="btn btn-sell" onclick="removeFromDeck(${index})">Usuń</button>
                        </div>
                    `;
                } else {
                    slot.innerHTML = `<span style="color: #777;">Wolny Slot ${index+1}</span>`;
                }
                container.appendChild(slot);
            });
        }

        function removeFromDeck(index) {
            activeDeck[index] = null;
            updateUI();
        }

        function renderHospital() {
            const grid = document.getElementById('hospital-grid');
            grid.innerHTML = '';
            let hasPatients = false;

            allCards.forEach(card => {
                const count = inventory[card.id] || 0;
                if (count > 0) {
                    const hp = cardHp[card.id];
                    if (hp < card.maxHp) {
                        hasPatients = true;
                        const healCost = Math.floor((card.maxHp - hp) * 0.5) + 5;
                        const cardDiv = document.createElement('div');
                        cardDiv.className = `card ${card.rarity}`;
                        cardDiv.innerHTML = `
                            <div class="card-inner-frame">
                                <div class="card-top-bar"><span>SZPITAL</span></div>
                                <div class="card-avatar"><img src="${card.icon}" alt=""></div>
                                <div class="card-name-banner">${card.name}</div>
                                <div class="card-stats-box" style="color:#ef4444;"><span>❤️ ${hp}/${card.maxHp}</span></div>
                                <button class="btn btn-sell" onclick="healCard('${card.id}', ${healCost})">Ulecz (${healCost} $)</button>
                            </div>
                        `;
                        grid.appendChild(cardDiv);
                    }
                }
            });

            if (!hasPatients) {
                grid.innerHTML = `<p style="grid-column: 1/-1; color: #aaa;">Wszyscy bohaterowie są zdrowi!</p>`;
            }
        }

        function healCard(cardId, cost) {
            if (money < cost) {
                alert("Nie masz wystarczająco dużo pieniędzy na leczenie!");
                return;
            }
            money -= cost;
            const card = allCards.find(c => c.id === cardId);
            cardHp[cardId] = card.maxHp;
            updateUI();
            alert("Bohater został w pełni uleczony!");
        }

        const bosses = {
            weak: { name: 'Słaby Goblin Boss', hp: 80, maxHp: 80, attack: 10, reward: 50 },
            good: { name: 'Opancerzony Najemnik', hp: 150, maxHp: 150, attack: 22, reward: 120 },
            mythic: { name: 'Wielki Lord Ciemności', hp: 300, maxHp: 300, attack: 40, reward: 300 },
            legendary: { name: 'Kosmiczny Tytan', hp: 500, maxHp: 500, attack: 65, reward: 750 }
        };

        function startBattle(type) {
            const deckCards = activeDeck.filter(id => id !== null);
            if (deckCards.length === 0) {
                alert("Twój deck jest pusty! Dodaj karty przed walką.");
                return;
            }
            const hasAlive = deckCards.some(id => cardHp[id] > 0);
            if (!hasAlive) {
                alert("Wszystkie karty w Twoim decku są nieprzytomne! Wylecz je w szpitalu.");
                return;
            }

            const template = bosses[type];
            currentBoss = { ...template };

            document.getElementById('boss-selection').style.display = 'none';
            document.getElementById('battle-arena').style.display = 'block';
            document.getElementById('boss-name-display').innerText = currentBoss.name;
            
            logMessage(`Pojawił się przeciwnik: ${currentBoss.name}! Wybierz kartę z decku, aby zaatakować.`);
            updateBattleUI();
        }

        function updateBattleUI() {
            const percent = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100);
            document.getElementById('boss-hp-fill').style.width = percent + '%';
            document.getElementById('boss-hp-text').innerText = `HP: ${Math.max(0, currentBoss.hp)}/${currentBoss.maxHp}`;

            const container = document.getElementById('battle-deck-container');
            container.innerHTML = '';
            activeDeck.forEach((cardId, index) => {
                const slot = document.createElement('div');
                slot.className = `deck-slot ${cardId ? 'filled' : ''}`;
                if (cardId) {
                    const card = allCards.find(c => c.id === cardId);
                    const hp = cardHp[cardId];
                    const isDead = hp <= 0;
                    slot.className += ` ${card.rarity} ${isDead ? 'locked' : ''}`;
                    slot.innerHTML = `
                        <div class="card-inner-frame" style="width:100%; height:100%;">
                            <div class="card-top-bar"><span>Slot ${index+1}</span></div>
                            <div class="card-avatar" style="width:40px; height:40px;"><img src="${card.icon}" alt=""></div>
                            <div class="card-name-banner">${card.name}</div>
                            <div class="card-stats-box"><span>❤️ ${hp}</span><span>⚔️ ${card.attack}</span></div>
                            ${!isDead ? `<button class="btn btn-sell" onclick="playerAttack('${cardId}')">Atakuj</button>` : '<span style="color:red; font-size:10px;">UTRACONA</span>'}
                        </div>
                    `;
                } else {
                    slot.innerHTML = `<span style="color: #777; font-size:11px;">Puste</span>`;
                }
                container.appendChild(slot);
            });
        }

        function playerAttack(cardId) {
            if (currentBoss.hp <= 0) return;

            const card = allCards.find(c => c.id === cardId);
            currentBoss.hp -= card.attack;
            logMessage(`${card.name} zadaje ${card.attack} pkt. obrażeń bossowi!`);

            if (currentBoss.hp <= 0) {
                logMessage(`Zwycięstwo! Pokonałeś bossa i zdobywasz ${currentBoss.reward} $!`);
                money += currentBoss.reward;
                updateUI();
                setTimeout(() => {
                    endBattle();
                    alert(`Wygrana! Otrzymano ${currentBoss.reward} $!`);
                }, 500);
                return;
            }

            setTimeout(() => {
                bossTurn();
            }, 600);

            updateBattleUI();
        }

        function bossTurn() {
            const aliveDeckCards = activeDeck.filter(id => id !== null && cardHp[id] > 0);
            if (aliveDeckCards.length === 0) {
                logMessage("Wszystkie Twoje karty poległy w walce!");
                setTimeout(() => {
                    endBattle();
                    alert("Przegrana! Twoje karty zostały pokonane.");
                }, 500);
                return;
            }

            const randomCardId = aliveDeckCards[Math.floor(Math.random() * aliveDeckCards.length)];
            const targetCard = allCards.find(c => c.id === randomCardId);

            cardHp[randomCardId] -= currentBoss.attack;
            if (cardHp[randomCardId] < 0) cardHp[randomCardId] = 0;

            logMessage(`${currentBoss.name} kontratakuje i zadaje ${currentBoss.attack} obrażeń postać ${targetCard.name}!`);

            if (cardHp[randomCardId] === 0) {
                logMessage(`⚠️ ${targetCard.name} stracił całe HP i zginął na zawsze!`);
                inventory[randomCardId]--;
                activeDeck = activeDeck.map(id => id === randomCardId ? null : id);
            }

            updateUI();
            updateBattleUI();
        }

        function logMessage(text) {
            const log = document.getElementById('battle-log');
            log.innerHTML += `<div>> ${text}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function endBattle() {
            currentBoss = null;
            document.getElementById('boss-selection').style.display = 'block';
            document.getElementById('battle-arena').style.display = 'none';
            document.getElementById('battle-log').innerHTML = '';
            updateUI();
        }

        function setSpinCount(count) {
            selectedSpinCount = count;
            document.querySelectorAll('.spin-btn-option').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`spin-count-${count}`).classList.add('selected');
            initRoulettes(count);
        }

        function initRoulettes(count) {
            const box = document.getElementById('roulettes-box');
            box.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'roulette-wrapper';
                wrapper.innerHTML = `
                    <div class="roulette-pointer"></div>
                    <div class="roulette-track" id="track-${i}"></div>
                `;
                box.appendChild(wrapper);
                fillTrack(`track-${i}`);
            }
        }

        function fillTrack(trackId) {
            const track = document.getElementById(trackId);
            track.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const randomCard = allCards[Math.floor(Math.random() * allCards.length)];
                const cardDiv = document.createElement('div');
                cardDiv.className = `wheel-card ${randomCard.rarity}`;
                cardDiv.innerHTML = `
                    <div class="card-avatar"><img src="${randomCard.icon}" alt=""></div>
                    <div class="card-name">${randomCard.name}</div>
                `;
                track.appendChild(cardDiv);
            }
        }

        function spinWheel() {
            const cost = selectedSpinCount * 35;
            if (money < cost) {
                alert("Za mało pieniędzy!");
                return;
            }

            money -= cost;
            updateUI();
            document.getElementById('spin-btn').disabled = true;
            let finishedCount = 0;
            let pulled = [];

            for (let i = 0; i < selectedSpinCount; i++) {
                const track = document.getElementById(`track-${i}`);
                const winningCard = getRandomCardByRarityWeights('rare');
                inventory[winningCard.id]++;
                if (cardHp[winningCard.id] <= 0) cardHp[winningCard.id] = winningCard.maxHp;
                pulled.push(winningCard);

                const cardDivs = track.children;
                if (cardDivs[22]) {
                    cardDivs[22].className = `wheel-card ${winningCard.rarity}`;
                    cardDivs[22].querySelector('.card-avatar img').src = winningCard.icon;
                    cardDivs[22].querySelector('.card-name').textContent = winningCard.name;
                }

                const cardWidth = 78;
                const targetOffset = 22 * cardWidth - 110 + Math.random() * 40;

                track.style.transition = 'transform 3s cubic-bezier(0.15, 0.85, 0.35, 1)';
                track.style.transform = `translateX(-${targetOffset}px)`;

                setTimeout(() => {
                    finishedCount++;
                    if (finishedCount === selectedSpinCount) {
                        document.getElementById('spin-btn').disabled = false;
                        updateUI();
                        showModal("Wyniki Koła Fortuny:", pulled);
                    }
                }, 3000);
            }
        }

        function showModal(title, cards) {
            document.getElementById('modal-title').innerText = title;
            const container = document.getElementById('pulled-cards-container');
            container.innerHTML = '';
            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.rarity}`;
                cardDiv.innerHTML = `
                    <div class="card-inner-frame">
                        <div class="card-top-bar">
                            <span>ID: ${card.id}</span>
                            <span class="card-chrome-logo">MARVEL</span>
                        </div>
                        <div class="card-avatar"><img src="${card.icon}" alt=""></div>
                        <div class="card-name-banner">${card.name}</div>
                        <div class="card-stats-box"><span>❤️ ${card.maxHp}</span><span>⚔️ ${card.attack}</span></div>
                        <div class="card-footer-box"><span class="card-value">${card.value} $</span></div>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
