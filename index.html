<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Marvel Card Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0d12;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        
        /* GÓRNY PASEK NALICZANIA / BUDŻETU */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .main-title {
            font-size: 24px;
            font-weight: 900;
            color: #b91c1c;
            letter-spacing: 2px;
            margin: 0;
        }
        .user-panel {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .daily-btn {
            background: #141a23;
            color: #38a169;
            border: 1px solid #1f2937;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .budget-box {
            background: #141a23;
            color: #e2e8f0;
            border: 1px solid #1f2937;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* PASEK ZAKŁADEK (NAWIGACJA) */
        .nav-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: #4b5563;
            font-size: 15px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active {
            background: #7f1d1d;
            color: #ffffff;
        }

        /* SEKCJE GRY */
        .game-section {
            display: none;
            background: #12161f;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #1f2937;
        }
        .game-section.active {
            display: block;
        }

        /* MODEL LOGOWANIA (STYL ZE ZDJĘCIA) */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #080a0e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-card {
            background: #161b26;
            border: 1px solid #dc2626;
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.2);
            border-radius: 12px;
            padding: 40px;
            width: 420px;
            text-align: center;
            box-sizing: border-box;
        }
        .login-card h2 {
            font-size: 26px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        .login-card p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 25px;
        }
        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .login-submit-btn {
            width: 100%;
            padding: 12px;
            background: #e11d48;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .login-submit-btn:hover {
            background: #be123c;
        }

        /* KARTY I INNE */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .card {
            background: #1c2331;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            border: 2px solid #374151;
        }
        .card.rare { border-color: #3b82f6; }
        .card.epic { border-color: #a855f7; }
        .card.mythic { border-color: #eab308; }
        .card.legendary { border-color: #ef4444; }
        .card.locked { opacity: 0.4; filter: grayscale(100%); }
        
        .btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-sell {
            background-color: #374151;
            font-size: 11px;
            padding: 4px 8px;
            margin-top: 5px;
        }
        .deck-slots {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .deck-slot {
            width: 130px;
            height: 180px;
            background: #0d1117;
            border: 2px dashed #374151;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .deck-slot.filled { border-style: solid; background: #1c2331; }

        /* MODAL Z NAGRODĄ */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #161b26;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>Logowanie do gry</h2>
            <p>Wpisz login i hasło (nowe konto utworzy się automatycznie)</p>
            <input type="text" id="login-user" class="login-input" placeholder="Login...">
            <input type="password" id="login-pass" class="login-input" placeholder="Hasło...">
            <button class="login-submit-btn" onclick="handleLogin()">Zaloguj się</button>
        </div>
    </div>

    <!-- GÓRNY PASEK GRY -->
    <div class="top-header">
        <h1 class="main-title">MARVEL CARD GAME ()</h1>
        <div class="user-panel">
            <button class="daily-btn" onclick="claimDaily()">Codzienna Nagroda (+150 $)</button>
            <div class="budget-box">Budżet: <span id="money">350</span> $</div>
        </div>
    </div>

    <!-- NAWIGACJA ZAKŁADEK -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchTab('shop', this)">Sklep</button>
        <button class="nav-btn" onclick="switchTab('wheel', this)">Koło Fortuny</button>
        <button class="nav-btn" onclick="switchTab('codes', this)">Kody</button>
        <button class="nav-btn" onclick="switchTab('deck', this)">Deck</button>
        <button class="nav-btn" onclick="switchTab('indeks', this)">Indeks</button>
        <button class="nav-btn" onclick="switchTab('walka', this)">Walka</button>
        <button class="nav-btn" onclick="switchTab('szpital', this)">Szpital</button>
    </div>

    <!-- 1. SKLEP -->
    <div id="tab-shop" class="game-section active">
        <h2>Kup paczki z kartami</h2>
        <div id="shop-packs" class="grid"></div>
    </div>

    <!-- 2. KOŁO FORTUNY -->
    <div id="tab-wheel" class="game-section">
        <h2>Koło Fortuny</h2>
        <button class="btn" id="spin-btn" onclick="spinWheel()">Zakręć (35 $)</button>
    </div>

    <!-- 3. KODY -->
    <div id="tab-codes" class="game-section">
        <h2>Kody Promocyjne</h2>
        <input type="text" id="promo-code-input" placeholder="Wpisz kod..." style="padding: 8px; border-radius: 4px; border: 1px solid #374151; background: #0d1117; color: #fff;">
        <button class="btn" onclick="redeemCode()">Użyj kodu</button>
    </div>

    <!-- 4. DECK -->
    <div id="tab-deck" class="game-section">
        <h2>Twój Aktywny Deck</h2>
        <div id="deck-slots-container" class="deck-slots"></div>
    </div>

    <!-- 5. INDEKS -->
    <div id="tab-indeks" class="game-section">
        <h2>Indeks / Kolekcja Kart</h2>
        <div id="collection-grid" class="grid"></div>
    </div>

    <!-- 6. WALKA -->
    <div id="tab-walka" class="game-section">
        <h2>Arena Walki z Bossami</h2>
        <div id="boss-selection">
            <p>Wybierz przeciwnika:</p>
            <button class="btn" onclick="startBattle('weak')">Słaby Goblin Boss</button>
            <button class="btn" onclick="startBattle('good')">Opancerzony Najemnik</button>
        </div>
        <div id="battle-arena" style="display: none;">
            <h3 id="boss-name-display"></h3>
            <div id="boss-hp-text">HP: 0/0</div>
            <div id="battle-log" style="background:#0d1117; padding:10px; height:100px; overflow-y:scroll; font-size:12px; border:1px solid #1f2937; margin: 10px 0;"></div>
            <div id="battle-deck-container" class="deck-slots"></div>
            <button class="btn" style="margin-top: 10px;" onclick="endBattle()">Uciekaj</button>
        </div>
    </div>

    <!-- 7. SZPITAL -->
    <div id="tab-szpital" class="game-section">
        <h2>Szpital (Leczenie Kart)</h2>
        <div id="hospital-grid" class="grid"></div>
    </div>

    <!-- MODAL -->
    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Nagroda</h2>
            <div id="pulled-cards-container" class="grid" style="margin: 15px 0;"></div>
            <button class="btn" onclick="closeModal()">Zamknij</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let money = 350;
        let lastDailyClaim = 0;
        let usedCodes = [];
        let currentBoss = null;

        const allCards = [
            { id: "iron_man", name: "Iron Man", rarity: "legendary", maxHp: 120, attack: 45, value: 500, icon: "" },
            { id: "spider_man", name: "Spider-Man", rarity: "epic", maxHp: 90, attack: 30, value: 250, icon: "" },
            { id: "captain_america", name: "Captain America", rarity: "epic", maxHp: 100, attack: 28, value: 250, icon: "" },
            { id: "thor", name: "Thor", rarity: "legendary", maxHp: 140, attack: 50, value: 600, icon: "" },
            { id: "hulk", name: "Hulk", rarity: "mythic", maxHp: 180, attack: 55, value: 400, icon: "" },
            { id: "hawkeye", name: "Hawkeye", rarity: "rare", maxHp: 70, attack: 20, value: 100, icon: "" }
        ];

        const packs = [
            { id: 'rare', name: 'Zwykła Paczka', price: 50, cardsCount: 3 },
            { id: 'epic', name: 'Epicka Paczka', price: 150, cardsCount: 3 },
            { id: 'mythic', name: 'Mityczna Paczka', price: 400, cardsCount: 3 },
            { id: 'legendary', name: 'Legendarna Paczka', price: 1000, cardsCount: 3 }
        ];

        let inventory = { iron_man: 1, spider_man: 2, captain_america: 1, thor: 0, hulk: 1, hawkeye: 3 };
        let cardHp = { iron_man: 120, spider_man: 90, captain_america: 100, hulk: 180, hawkeye: 70 };
        let activeDeck = ["iron_man", "spider_man", null, null];

        function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            if(!user) { alert("Wpisz login!"); return; }

            currentUser = user;
            document.getElementById('login-overlay').style.display = 'none';
            updateUI();
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.game-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        function updateUI() {
            document.getElementById('money').innerText = money;
            renderShop();
            renderCollection();
            renderDeck();
            renderHospital();
        }

        function claimDaily() {
            const now = Date.now();
            if (now - lastDailyClaim < 86400000) {
                alert("Odbierz ponownie za 24h!");
                return;
            }
            lastDailyClaim = now;
            money += 150;
            updateUI();
        }

        function renderShop() {
            const shopContainer = document.getElementById('shop-packs');
            shopContainer.innerHTML = '';
            packs.forEach(pack => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <h3>${pack.name}</h3>
                    <p>${pack.cardsCount} karty</p>
                    <p style="color:#22c55e; font-weight:bold;">${pack.price} $</p>
                    <button class="btn" onclick="openPack('${pack.id}')">Kup</button>
                `;
                shopContainer.appendChild(cardEl);
            });
        }

        function openPack(packId) {
            const pack = packs.find(p => p.id === packId);
            if (!pack || money < pack.price) { alert("Za mało kasy!"); return; }
            money -= pack.price;
            let pulled = [allCards[0]];
            inventory[allCards[0].id]++;
            updateUI();
            showModal(`Otwarto paczkę: ${pack.name}`, pulled);
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            allCards.forEach(card => {
                const count = inventory[card.id] || 0;
                const hp = cardHp[card.id] !== undefined ? cardHp[card.id] : card.maxHp;
                const cardDiv = document.createElement('div');
                cardDiv.className = `card ${card.rarity} ${count === 0 ? 'locked' : ''}`;
                cardDiv.innerHTML = `
                    <div style="font-size:10px; color:#aaa;">ID: ${card.id}</div>
                    <strong>${card.name}</strong>
                    <div>❤️ ${hp}/${card.maxHp} | ⚔️ ${card.attack}</div>
                    <div>x${count}</div>
                `;
                grid.appendChild(cardDiv);
            });
        }

        function renderDeck() {
            const container = document.getElementById('deck-slots-container');
            container.innerHTML = '';
            activeDeck.forEach((cardId, index) => {
                const slot = document.createElement('div');
                slot.className = `deck-slot ${cardId ? 'filled' : ''}`;
                if (cardId) {
                    const card = allCards.find(c => c.id === cardId);
                    slot.innerHTML = `<div><strong>${card.name}</strong></div>`;
                } else {
                    slot.innerHTML = `<span style="color: #555;">Slot ${index+1}</span>`;
                }
                container.appendChild(slot);
            });
        }

        function renderHospital() {
            const grid = document.getElementById('hospital-grid');
            grid.innerHTML = '<p style="color:#aaa;">Wszyscy zdrowi!</p>';
        }

        function redeemCode() { alert("Kod wykorzystany!"); }
        function spinWheel() { alert("Losowanie!"); }
        function startBattle() { alert("Start walki!"); }
        function endBattle() {}

        function showModal(title, cards) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
