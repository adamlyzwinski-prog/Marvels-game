<script>
function renderShop() {
    const container = document.getElementById('shop-packs');
    container.innerHTML = '';

    packs.forEach(pack => {
        const div = document.createElement('div');
        div.className = `pack-card pack-${pack.id}`;

        div.innerHTML = `
            <div>
                <h3 style="font-family:'Orbitron',sans-serif; margin-top:0;">
                    ${pack.name}
                </h3>

                <p style="color:#a0aec0;">
                    Zawiera ${pack.cardsCount} karty oraz ${pack.itemsCount} przedmioty.
                </p>
            </div>

            <div>
                <p style="font-family:'Orbitron',sans-serif;">
                    <strong>Cena: ${pack.price} $</strong>
                </p>

                <button class="btn" onclick="buyPack('${pack.id}')" ${money < pack.price ? 'disabled' : ''}>
                    Kup
                </button>
            </div>
        `;

        container.appendChild(div);
    });
}
</script>
