<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvels Deck Builder & Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --hero-color: #ec4899;
            --item-color: #eab308;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .panel h2 {
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .card.hero {
            border-color: var(--hero-color);
        }
        .card.hero:hover {
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
        }

        .card.item {
            border-color: var(--item-color);
        }
        .card.item:hover {
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
        }

        .card h3 {
            margin: 5px 0;
            font-size: 1rem;
        }

        .card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 4px 0;
        }

        .deck-area {
            grid-column: 1 / -1;
            background: #111827;
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .deck-slots {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .slot {
            width: 160px;
            min-height: 100px;
            background: #1e293b;
            border: 2px solid #4b5563;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .slot span {
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 5px;
        }

        button.action-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <h1>Marvels Arena</h1>
    <p class="subtitle">Wybierz swoją postać, dopasuj potężny przedmiot i stwórz deck!</p>

    <div class="container">
        <!-- KAT: POSTACIE -->
        <div class="panel">
            <h2 style="color: var(--hero-color);">Kategoria: Postacie (4)</h2>
            <div class="grid-cards" id="hero-list">
                <!-- Generowane przez JS -->
            </div>
        </div>

        <!-- KAT: PRZEDMIOTY -->
        <div class="panel">
            <h2 style="color: var(--item-color);">Kategoria: Przedmioty (4)</h2>
            <div class="grid-cards" id="item-list">
                <!-- Generowane przez JS -->
            </div>
        </div>

        <!-- DECK / EKWIPUNEK -->
        <div class="deck-area">
            <h2>Twój Aktywny Deck</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Kliknij postać, a następnie przedmiot, aby połączyć je w decku.</p>
            <div class="deck-slots">
                <div class="slot">
                    <span>Wybrana Postać</span>
                    <div id="deck-hero">Brak</div>
                </div>
                <div class="slot">
                    <span>Przypisany Przedmiot</span>
                    <div id="deck-item">Brak</div>
                </div>
            </div>
            <button class="action-btn" onclick="startBattle()">Rozpocznij Test Walki</button>
        </div>
    </div>

    <script>
        // Dane: 4 postacie i 4 przedmioty (ten sam poziom zbalansowania)
        const heroes = [
            { id: 1, name: "Iron Man", power: 85, desc: "Typ: Technologia" },
            { id: 2, name: "Thor", power: 90, desc: "Typ: Bóstwo" },
            { id: 3, name: "Spider-Man", power: 80, desc: "Typ: Zwinność" },
            { id: 4, name: "Hulk", power: 95, desc: "Typ: Siła" }
        ];

        const items = [
            { id: 1, name: "Rękawica Nieskończoności", bonus: "+50 Ataku", value: 50 },
            { id: 2, name: "Tarcza Vibranium", bonus: "+50 Obrony", value: 50 },
            { id: 3, name: "Młot Mjolnir", bonus: "+50 Siły", value: 50 },
            { id: 4, name: "Reaktor Łukowy", bonus: "+50 Energii", value: 50 }
        ];

        let selectedHero = null;
        let selectedItem = null;

        function render() {
            // Render Postaci
            const heroList = document.getElementById('hero-list');
            heroList.innerHTML = '';
            heroes.forEach(h => {
                heroList.innerHTML += `
                    <div class="card hero" onclick="selectHero('${h.name}', ${h.power})">
                        <h3>${h.name}</h3>
                        <p>${h.desc}</p>
                        <p>Poziom: ${h.power}</p>
                    </div>
                `;
            });

            // Render Przedmiotów
            const itemList = document.getElementById('item-list');
            itemList.innerHTML = '';
            items.forEach(i => {
                itemList.innerHTML += `
                    <div class="card item" onclick="selectItem('${i.name}', ${i.value})">
                        <h3>${i.name}</h3>
                        <p>${i.bonus}</p>
                        <p>Tier: 1</p>
                    </div>
                `;
            });
        }

        function selectHero(name, power) {
            selectedHero = { name, power };
            document.getElementById('deck-hero').innerHTML = `<b>${name}</b><br><small>Moc: ${power}</small>`;
        }

        function selectItem(name, value) {
            selectedItem = { name, value };
            document.getElementById('deck-item').innerHTML = `<b>${name}</b><br><small>Bonus: +${value}</small>`;
        }

        function startBattle() {
            if (!selectedHero || !selectedItem) {
                alert("Wybierz najpierw zarówno postać, jak i przedmiot do swojego decku!");
                return;
            }
            const totalPower = selectedHero.power + selectedItem.value;
            alert(`Deck gotowy!\nPostać: ${selectedHero.name}\nPrzedmiot: ${selectedItem.name}\nCałkowita Siła Bojowa: ${totalPower}`);
        }

        render();
    </script>
</body>
</html>
