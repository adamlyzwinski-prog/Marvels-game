<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Card Game</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent: #e50914;
            --text-color: #ffffff;
            
            --rare: #3b82f6;
            --epic: #a855f7;
            --mythic: #ef4444;
            --legendary: #eab308;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 50%, #0b0c10 100%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-box {
            background: rgba(31, 40, 51, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 2px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #3a4750;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a4750;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        header {
            background-color: rgba(31, 40, 51, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stats {
            font-size: 18px;
            font-weight: bold;
            background: rgba(229, 9, 20, 0.15);
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            box-shadow: inset 0 0 10px rgba(229,9,20,0.2);
        }

        nav {
            display: flex;
            gap: 10px;
            background: rgba(31, 40, 51, 0.85);
            padding: 12px 30px;
            border-bottom: 1px solid #2a2e43;
            backdrop-filter: blur(5px);
            flex-wrap: wrap;
        }

        nav button {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        nav button.active, nav button:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }

        main {
            flex: 1;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .pack-card {
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            color: #fff;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .pack-visual {
            width: 110px;
            height: 150px;
            border-radius: 8px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.2);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: bold;
            border: 2px solid rgba(255,255,255,0.3);
            transition: transform 0.3s;
        }

        .pack-card:hover .pack-visual {
            transform: scale(1.05) rotate(2deg);
        }

        .pack-card.rare-pack {
            background: linear-gradient(135deg, rgba(30,58,138,0.8), rgba(15,23,42,0.9));
            border: 2px solid var(--rare);
        }
        .rare-pack .pack-visual { background: linear-gradient(135deg, #1e40af, #3b82f6, #1d4ed8); }

        .pack-card.epic-pack {
            background: linear-gradient(135deg, rgba(88,28,135,0.8), rgba(15,23,42,0.9));
            border: 2px solid var(--epic);
        }
        .epic-pack .pack-visual { background: linear-gradient(135deg, #6b21a8, #a855f7, #581c87); }

        .pack-card.mythic-pack {
            background: linear-gradient(135deg, rgba(127,29,29,0.8), rgba(15,23,42,0.9));
            border: 2px solid var(--mythic);
        }
        .mythic-pack .pack-visual { background: linear-gradient(135deg, #991b1b, #ef4444, #7f1d1d); }

        .pack-card.legendary-pack {
            background: linear-gradient(135deg, rgba(113,63,18,0.8), rgba(15,23,42,0.9));
            border: 2px solid var(--legendary);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3);
        }
        .legendary-pack .pack-visual { background: linear-gradient(135deg, #854d0e, #eab308, #ca8a04); }

        .pack-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover { background: #b20710; }
        .btn:disabled { background: #444; cursor: not-allowed; box-shadow: none; filter: grayscale(0.5); }

        .btn-sell {
            background: #10b981;
            padding: 4px 8px;
            font-size: 11px;
            margin-top: 5px;
            display: inline-block;
        }
        .btn-sell:hover { background: #059669; }

        .btn-daily {
            background: #10b981;
            padding: 8px 14px;
            font-size: 14px;
            margin-top: 0;
        }
        .btn-daily:hover { background: #059669; }

        .codes-container, .battle-container {
            background: rgba(31, 40, 51, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #3a4750;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .codes-container input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #111;
            border: 1px solid #3a4750;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }

        .wheel-container {
            text-align: center;
            background: rgba(31, 40, 51, 0.9);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #3a4750;
            max-width: 750px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spin-count-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .spin-btn-option {
            background: #2a2e43;
            color: #fff;
            border: 2px solid #444;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .spin-btn-option.selected {
            border-color: var(--accent);
            background: rgba(229, 9, 20, 0.2);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        .roulettes-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin: 10px 0;
            max-height: 400px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 2px;
        }

        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 90px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            border: 1px solid #3a4750;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .roulette-pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #e50914;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 8px #e50914;
        }

        .roulette-track {
            display: flex;
            position: absolute;
            gap: 8px;
            will-change: transform;
            padding-left: 20px;
        }

        .wheel-card {
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            border: 2px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70px;
            min-width: 70px;
            height: 78px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .wheel-card.rare { border-color: var(--rare); background: linear-gradient(135deg, #0f172a, #1e3a8a); }
        .wheel-card.epic { border-color: var(--epic); background: linear-gradient(135deg, #0f172a, #581c87); }
        .wheel-card.mythic { border-color: var(--mythic); background: linear-gradient(135deg, #0f172a, #7f1d1d); }
        .wheel-card.legendary { border-color: var(--legendary); background: linear-gradient(135deg, #1c1917, #713f12); box-shadow: 0 0 8px rgba(234, 179, 8, 0.4); }

        .wheel-card .card-avatar {
            width: 28px;
            height: 28px;
            font-size: 13px;
            border-radius: 50%;
            background: radial-gradient(circle, #3a4750 0%, #1f2833 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .wheel-card .card-name {
            font-size: 8px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .wheel-card .card-rarity {
            font-size: 6px;
            text-transform: uppercase;
        }

        .deck-slots {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .deck-slot {
            width: 140px;
            height: 210px;
            background: rgba(31, 40, 51, 0.6);
            border: 2px dashed #555;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
        }

        .deck-slot.filled {
            border-style: solid;
            background: rgba(31, 40, 51, 0.95);
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        .card {
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border: 3px solid #333;
            position: relative;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 130px;
            min-width: 130px;
            height: 190px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .card.rare { 
            border-color: var(--rare); 
            background: linear-gradient(160deg, #091e3a 0%, #1e3a8a 100%);
        }
        .card.epic { 
            border-color: var(--epic); 
            background: linear-gradient(160deg, #2e1065 0%, #581c87 100%);
        }
        .card.mythic { 
            border-color: var(--mythic); 
            background: linear-gradient(160deg, #450a0a 0%, #7f1d1d 100%);
        }
        .card.legendary { 
            border-color: var(--legendary); 
            background: linear-gradient(160deg, #422006 0%, #713f12 100%);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }

        .card-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #3a4750 0%, #1f2833 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .card-rarity {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .card.rare .card-rarity { color: var(--rare); }
        .card.epic .card-rarity { color: var(--epic); }
        .card.mythic .card-rarity { color: var(--mythic); }
        .card.legendary .card-rarity { color: var(--legendary); }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .card-value {
            font-size: 10px;
            color: #fbbf24;
        }

        .card-count {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 9px;
            display: inline-block;
        }

        .card.locked {
            opacity: 0.3;
            filter: grayscale(1);
            background: rgba(26, 28, 41, 0.95) !important;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: rgba(31, 40, 51, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pack-opening-area {
            position: relative;
            width: 200px;
            height: 280px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .closed-pack {
            width: 150px;
            height: 220px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,255,255,0.3);
            border: 3px solid rgba(255,255,255,0.4);
            animation: pulsePack 1.5s infinite alternate;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            font-weight: bold;
            color: #fff;
            transition: transform 0.3s;
        }

        .closed-pack:hover {
            transform: scale(1.08);
        }

        @keyframes packBurst {
            0% { transform: scale(1); opacity: 1; filter: brightness(1); }
            50% { transform: scale(1.4); opacity: 0.8; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }

        .burst-animation {
            animation: packBurst 0.4s ease-out forwards;
        }

        @keyframes pulsePack {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(-2deg); }
            100% { transform: scale(1) rotate(2deg); }
        }

        @keyframes slideOutCard {
            0% {
                transform: translateY(60px) scale(0.6);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .opening-card-container {
            animation: slideOutCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .pack-counter {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>Logowanie do gry</h2>
            <p style="font-size: 13px; color: #aaa;">Wpisz login i hasło (nowe konto utworzy się automatycznie)</p>
            <input type="text" id="username-input" placeholder="Nazwa użytkownika" autocomplete="off">
            <input type="password" id="password-input" placeholder="Hasło">
            <button class="btn" style="width: 100%; margin-top: 15px;" onclick="handleLogin()">Zaloguj się</button>
        </div>
    </div>

    <header>
        <h1>Marvel Card Game (<span id="logged-user-display" style="font-size: 16px; color: #fff;"></span>)</h1>
        <div class="header-right">
            <button class="btn btn-daily" onclick="claimDaily()">Codzienna Nagroda (+150 $)</button>
            <div class="stats">Budżet: <span id="money">350</span> $</div>
        </div>
    </header>

    <nav>
        <button class="tab-btn active" onclick="switchTab('shop')">Sklep</button>
        <button class="tab-btn" onclick="switchTab('wheel')">Koło Fortuny</button>
        <but
